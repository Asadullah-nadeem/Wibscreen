<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WibOS / Linux VM Emulator</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #header {
            background-color: #111827;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }
        #header h1 {
            margin: 0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #60a5fa;
        }
        #container {
            flex: 1;
            display: flex;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }
        #emulator-screen {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
            position: relative;
        }
        #screen_container {
            background-color: #000;
            white-space: pre;
            font-family: monospace;
            font-size: 14px;
            line-height: 16px;
            cursor: text;
        }
        #screen_container:focus {
            outline: none;
        }
        #status {
            width: 100%;
            padding: 8px 20px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: background 0.15s ease;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .scaled-screen {
            width: 100% !important;
            height: calc(100vh - 100px) !important;
            max-height: none !important;
            min-height: none !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .scaled-screen canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
        .scaled-screen pre {
            font-size: 1.6vw !important;
            line-height: 1.8vw !important;
        }
        #debug_log {
            position: fixed;
            bottom: 45px;
            left: 20px;
            right: 20px;
            max-height: 120px;
            background: rgba(20, 20, 20, 0.95);
            color: #f87171;
            padding: 12px;
            border: 1px solid #ef4444;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            overflow-y: auto;
            z-index: 10000;
            white-space: pre-wrap;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: none;
        }
        .success-msg { color: #34d399; }
        .info-msg { color: #60a5fa; }
    </style>
    <script>
        // Global error catcher
        window.errors_logged = [];
        function logDebug(msg, type = 'error') {
            const logDiv = document.getElementById("debug_log");
            if (logDiv) {
                let colorClass = "color: #f87171;";
                if (type === 'success') colorClass = "color: #34d399;";
                if (type === 'info') colorClass = "color: #60a5fa;";
                logDiv.innerHTML += `<div style="${colorClass}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
                logDiv.scrollTop = logDiv.scrollHeight;
            } else {
                window.errors_logged.push({ msg, type });
            }
        }
        window.onerror = function(message, source, lineno, colno, error) {
            logDebug(`JS Error: ${message} at ${source}:${lineno}`);
            return false;
        };
        window.onunhandledrejection = function(event) {
            logDebug(`Promise Rejection: ${event.reason}`);
        };
    </script>
    <script src="../libv86.js" onerror="logDebug('Failed to load libv86.js. Check path ../libv86.js')"></script>
</head>
<body>
    <div id="header">
        <h1><i class="fas fa-microchip text-success"></i> WibOS / Linux VM Emulator</h1>
        <div style="display: flex; align-items: center; gap: 12px;">
            <label for="os-select" style="font-size: 0.8rem; color: #9ca3af;">Select OS:</label>
            <select id="os-select" style="background-color: #1f2937; color: white; border: 1px solid #374151; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; outline: none; cursor: pointer;">
                <option value="wibos">WibOS (Custom C/Assembly OS)</option>
                <option value="slitaz">Tiny Core Linux (GUI Desktop - 19MB)</option>
            </select>
            <button class="btn" id="btn-load-local" style="background-color: #4b5563;"><i class="fas fa-file-upload"></i> Load Local ISO/Image</button>
            <input type="file" id="local-file-input" style="display: none;" accept=".iso,.img,.bin">
            <button class="btn" id="btn-restart"><i class="fas fa-redo"></i> Restart VM</button>
            <button class="btn" id="btn-toggle-scale" style="background-color: #374151;"><i class="fas fa-expand-arrows-alt"></i> Scale to Fit</button>
            <button class="btn" id="btn-toggle-status" style="background-color: #374151;"><i class="fas fa-eye-slash"></i> Hide Status</button>
            <button class="btn" id="btn-fullscreen"><i class="fas fa-expand"></i> Fullscreen</button>
            <button class="btn" id="btn-debug" style="background-color: #374151;"><i class="fas fa-bug"></i> Logs</button>
        </div>
    </div>

    <div id="container">
        <!-- Emulator Container -->
        <div id="emulator-screen">
            <div id="screen_container" tabindex="0"></div>
            <div id="status">
                <span id="status-text">Initializing emulator...</span>
                <span>Keyboard: Enabled | Mouse: Click inside screen to capture</span>
            </div>
        </div>
    </div>

    <div id="debug_log">
        <div style="font-weight: bold; border-bottom: 1px solid #ef4444; margin-bottom: 8px; padding-bottom: 4px; color: #ef4444;">WibOS Debugger Panel</div>
    </div>

    <script>
        const CACHE_NAME = 'wibscreen-v86-cache-v1';

        async function getCacheStorageAssetUrl(key, url, statusText) {
            try {
                const cache = await caches.open(CACHE_NAME);
                let response = await cache.match(url);
                if (!response) {
                    statusText.innerText = "Downloading " + key + " (first-time cache)...";
                    response = await fetch(url);
                    if (!response.ok) throw new Error("Fetch failed");
                    await cache.put(url, response.clone());
                }
                const blob = await response.blob();
                return URL.createObjectURL(blob);
            } catch (e) {
                console.error("Cache Storage Error for " + key + ":", e);
                return url; // fallback to raw path
            }
        }

        // Print pre-logged messages
        if (window.errors_logged) {
            window.errors_logged.forEach(err => logDebug(err.msg, err.type));
        }

        // Toggle debug logs
        document.getElementById("btn-debug").onclick = function() {
            const panel = document.getElementById("debug_log");
            panel.style.display = panel.style.display === "none" ? "block" : "none";
        };

        // Retrieve selected OS
        let selectedOS = localStorage.getItem('wibscreen_selected_os') || 'wibos';
        if (selectedOS !== 'wibos' && selectedOS !== 'slitaz') {
            selectedOS = 'wibos';
        }
        const STATE_KEY = 'v86_state_' + selectedOS;

        window.onload = async function() {
            logDebug("Window loaded. Checking assets...", "info");

            const statusText = {
                set innerText(val) {
                    console.log("[Status]:", val);
                    const el = document.getElementById("status-text");
                    if (el) el.innerText = val;
                }
            };

            // Setup select dropdown value
            const osSelect = document.getElementById("os-select");
            if (osSelect) {
                osSelect.value = selectedOS;
                osSelect.onchange = function() {
                    localStorage.setItem('wibscreen_selected_os', this.value);
                    window.location.reload();
                };
            }

            let isoFilename, isoLabel, memSize, vgaMemSize;
            const isWibOS = (selectedOS === 'wibos');
            if (isWibOS) {
                isoFilename = "wibos.img";
                isoLabel = "WibOS Custom Boot Image";
                memSize = 16 * 1024 * 1024;
                vgaMemSize = 2 * 1024 * 1024;
            } else {
                isoFilename = "../tinycore.iso";
                isoLabel = "Tiny Core Linux Live GUI";
                memSize = 256 * 1024 * 1024;
                vgaMemSize = 8 * 1024 * 1024;
            }

            statusText.innerText = "Locating VM engine in Cache Storage...";
            let wasmUrl, biosUrl, vgaBiosUrl;
            try {
                wasmUrl = await getCacheStorageAssetUrl("WebAssembly Engine", "../v86.wasm", statusText);
                biosUrl = await getCacheStorageAssetUrl("System BIOS", "../seabios.bin", statusText);
                vgaBiosUrl = await getCacheStorageAssetUrl("VGA BIOS", "../vgabios.bin", statusText);
                logDebug("Cached assets loaded successfully.", "success");
            } catch (cacheErr) {
                logDebug("Cache retrieval failed: " + cacheErr.message + ". Falling back to raw paths.", "error");
                wasmUrl = "../v86.wasm";
                biosUrl = "../seabios.bin";
                vgaBiosUrl = "../vgabios.bin";
            }
            const isoUrl = isoFilename;

            logDebug("Initializing V86 Starter...", "info");
            const V86Starter = window.V86Starter || window.V86;

            const config = {
                wasm_path: wasmUrl,
                memory_size: memSize,
                vga_memory_size: vgaMemSize,
                screen_container: document.getElementById("screen_container"),
                bios: { url: biosUrl },
                vga_bios: { url: vgaBiosUrl },
                autostart: true
            };

            if (isWibOS) {
                config.fda = { url: isoUrl };
            } else {
                config.cdrom = { url: isoUrl };
            }

            let currentEmulator = null;

            function startEmulator(customConfig = null) {
                if (currentEmulator) {
                    try {
                        currentEmulator.destroy();
                    } catch (e) {
                        console.error("Error destroying old emulator:", e);
                    }
                    currentEmulator = null;
                }

                // Clear screen container
                const containerEl = document.getElementById("screen_container");
                containerEl.innerHTML = "";

                statusText.innerText = "Booting OS kernel...";
                try {
                    const finalConfig = customConfig || config;
                    currentEmulator = new V86Starter(finalConfig);
                    const isCustomWibOS = finalConfig.fda && (!finalConfig.fda.url);
                    
                    currentEmulator.add_listener("emulator-ready", function() {
                        statusText.innerText = (isCustomWibOS || isWibOS)
                            ? "WibOS Custom C/Assembly Kernel Loaded successfully!" 
                            : "Tiny Core Linux VM Booted successfully! Click inside the VM screen to capture mouse.";
                        logDebug("Emulator loaded and running.", "success");
                    });
                } catch (err) {
                    logDebug(`Initialization failed: ${err.message}`, "error");
                    statusText.innerText = "Initialization failed: " + err.message;
                }
            }

            // Handle loading a local ISO or floppy image file directly from user disk
            const btnLoadLocal = document.getElementById("btn-load-local");
            const localFileInput = document.getElementById("local-file-input");

            btnLoadLocal.onclick = function() {
                localFileInput.click();
            };

            localFileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;

                statusText.innerText = "Loading local file: " + file.name + "...";
                const isImageFile = file.name.endsWith(".img") || file.name.endsWith(".bin");

                // Construct a new config using the local file
                const localConfig = {
                    wasm_path: wasmUrl,
                    memory_size: isImageFile ? 16 * 1024 * 1024 : 256 * 1024 * 1024,
                    vga_memory_size: isImageFile ? 2 * 1024 * 1024 : 8 * 1024 * 1024,
                    screen_container: document.getElementById("screen_container"),
                    bios: { url: biosUrl },
                    vga_bios: { url: vgaBiosUrl },
                    autostart: true
                };

                if (isImageFile) {
                    localConfig.fda = { file: file };
                } else {
                    localConfig.cdrom = { file: file };
                }

                // Restart emulator with the local file
                startEmulator(localConfig);
            };

            // Initial startup
            startEmulator();

            // Scale and Status Bar toggles
            let isScaled = localStorage.getItem('wibscreen_scaled') === 'true';
            let isStatusHidden = localStorage.getItem('wibscreen_status_hidden') === 'true';

            const btnToggleScale = document.getElementById("btn-toggle-scale");
            const btnToggleStatus = document.getElementById("btn-toggle-status");
            const screenContainer = document.getElementById("screen_container");
            const statusElem = document.getElementById("status");

            function updateScaleUI() {
                if (isScaled) {
                    screenContainer.classList.add("scaled-screen");
                    btnToggleScale.innerHTML = '<i class="fas fa-compress"></i> Original Size';
                } else {
                    screenContainer.classList.remove("scaled-screen");
                    btnToggleScale.innerHTML = '<i class="fas fa-expand-arrows-alt"></i> Scale to Fit';
                }
            }

            function updateStatusUI() {
                if (isStatusHidden) {
                    statusElem.style.display = "none";
                    btnToggleStatus.innerHTML = '<i class="fas fa-eye"></i> Show Status';
                } else {
                    statusElem.style.display = "flex";
                    btnToggleStatus.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Status';
                }
            }

            btnToggleScale.onclick = function() {
                isScaled = !isScaled;
                localStorage.setItem('wibscreen_scaled', isScaled);
                updateScaleUI();
            };

            btnToggleStatus.onclick = function() {
                isStatusHidden = !isStatusHidden;
                localStorage.setItem('wibscreen_status_hidden', isStatusHidden);
                updateStatusUI();
            };

            updateScaleUI();
            updateStatusUI();

            document.getElementById("btn-restart").onclick = function() {
                startEmulator();
            };

            document.getElementById("btn-fullscreen").onclick = function() {
                var elem = document.getElementById("emulator-screen");
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            };
        };
    </script>
</body>
</html>
