<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tiny Core GUI Standalone VM</title>
    <style>
        body, html { margin: 0; padding: 0; background: #000; color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #screen_container { white-space: pre; font-family: monospace; font-size: 14px; }
        #screen_container:focus { outline: none; }
    </style>
    <script src="../libv86.js"></script>
</head>
<body>
    <div id="screen_container" tabindex="0"></div>
    <script>
        window.onload = function() {
            const emulator = new V86Starter({
                wasm_path: "../v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                screen_container: document.getElementById("screen_container"),
                bios: { url: "../seabios.bin" },
                vga_bios: { url: "../vgabios.bin" },
                cdrom: { url: "tinycore-gui.iso" }, // Loading the local iso
                autostart: true,
                cmdline: "tsc=reliable rcupdate.rcu_expedited=1 mitigations=off rw"
            });
        };
    </script>
</body>
</html>
