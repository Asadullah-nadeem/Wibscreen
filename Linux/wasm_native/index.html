<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native WebAssembly Speed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #111827;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 600px;
            border: 1px solid #1f2937;
        }

        h2 {
            color: #34d399;
            margin-top: 0;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 600;
            transition: 0.2s all;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #1f2937;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            color: #60a5fa;
            line-height: 1.6;
            text-align: left;
        }

        .time {
            color: #f59e0b;
        }

        .success {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2><i class="fas fa-bolt text-warning"></i> Native WebAssembly</h2>
        <p style="color: #9ca3af; font-size: 0.9rem;">This executes compiled C code directly in your browser's
            Javascript V8 engine without loading a virtual PC operating system. This results in incredibly fast 10x+
            native performance.</p>

        <button id="runBtn"><i class="fas fa-play"></i> Run C Code Natively in WASM</button>

        <div class="result" id="output">Waiting for execution command...</div>
    </div>

    <script>
        // Instead of forcing you to install Clang/Emscripten to compile add.c to math.wasm,
        // we have embedded the raw compiled WebAssembly bytecode for the C `add` function directly here!

        // This bytecode is exactly what `add.c` looks like after being compiled to WebAssembly.
        const wasmCode = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, // Magic header (\0asm)
            0x01, 0x00, 0x00, 0x00, // WASM Version 1
            0x01, 0x07, 0x01, 0x60, 0x02, 0x7f, 0x7f, 0x01, 0x7f, // Type section: 1 function (int, int) -> int
            0x03, 0x02, 0x01, 0x00, // Function section: Function 0
            0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00, // Export section: Export Function 0 as "add"
            0x0a, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a, 0x0b // Code section: local.get 0, local.get 1, i32.add, end
        ]);

        document.getElementById("runBtn").addEventListener("click", async () => {
            const output = document.getElementById("output");
            output.innerText = "Instantiating C Code via WebAssembly...";

            try {
                // Instantiating the raw C compiled bytecode directly in the JS Engine
                const wasmModule = await WebAssembly.instantiate(wasmCode);

                // Extracting our exported 'add' function originating from C!
                const c_add = wasmModule.instance.exports.add;

                const startTime = performance.now();

                // Running the compiled C function natively!
                const num1 = 50000;
                const num2 = 90000;
                const result = c_add(num1, num2);

                const endTime = performance.now();
                const timeMs = (endTime - startTime).toFixed(4);

                output.innerHTML = `
                    Executing <strong>add.c</strong> directly inside browser:<br><br>
                    C Function Called: <span style="color:#fff">add(${num1}, ${num2})</span><br>
                    Calculated Result: <span class="success">${result}</span><br>
                    Time Taken: <span class="time">${timeMs} ms</span> (Native Speed!)
                `;
            } catch (e) {
                console.error(e);
                output.innerText = "Failed to run WebAssembly code: " + e.message;
            }
        });
    </script>
</body>

</html>
