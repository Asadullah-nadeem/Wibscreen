<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login — Wibscreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<div class="wb-auth-wrap">
  <div style="width:100%;max-width:420px;">

    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="about.html" class="d-inline-flex align-items-center gap-2 wb-brand mb-3">
        <div class="wb-logo-badge">WS</div>
        <span>Wibscreen</span>
      </a>
    </div>

    <div class="wb-auth-card">
      <h1 class="wb-auth-title">Welcome back</h1>
      <p class="wb-auth-sub">Sign in to your workspace</p>

      <!-- Alert -->
      <div id="login-alert" class="wb-alert alert-danger text-danger" style="background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.3);">
        <i class="fas fa-circle-exclamation me-2"></i><span id="login-alert-msg">Invalid credentials.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="login-email">Email address</label>
          <input id="login-email" type="email" class="form-control wb-form-control"
                 placeholder="you@example.com" autocomplete="email" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label small fw-semibold mb-0" for="login-pwd">Password</label>
            <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
          </div>
          <div class="wb-pwd-wrap">
            <input id="login-pwd" type="password" class="form-control wb-form-control"
                   placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="wb-pwd-toggle" id="login-pwd-toggle" aria-label="Toggle password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Password is required.</div>
        </div>

        <div class="mb-4 d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" id="login-remember" style="width:18px;height:18px;border-radius:5px;">
          <label class="form-check-label small" for="login-remember">Remember me</label>
        </div>

        <button type="submit" class="wb-btn-primary" id="login-submit">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="text-center mt-4 small text-body-secondary">
        Don't have an account?
        <a href="signup.html" class="text-primary text-decoration-none fw-semibold">Sign Up</a>
      </div>
    </div>

    <!-- Footer links -->
    <div class="text-center mt-4 small text-body-secondary d-flex flex-wrap justify-content-center gap-3">
      <a href="privacy.html" class="text-body-secondary text-decoration-none">Privacy</a>
      <a href="terms.html"   class="text-body-secondary text-decoration-none">Terms</a>
      <a href="security.html" class="text-body-secondary text-decoration-none">Security</a>
      <a href="support.html" class="text-body-secondary text-decoration-none">Support</a>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
$('#login-pwd-toggle').on('click', function () {
  const $pwd = $('#login-pwd');
  const show = $pwd.attr('type') === 'password';
  $pwd.attr('type', show ? 'text' : 'password');
  $(this).find('i').toggleClass('fa-eye fa-eye-slash');
});

$('#login-form').on('submit', function (e) {
  e.preventDefault();

  const email = $('#login-email').val().trim();
  const pwd   = $('#login-pwd').val();
  const $btn  = $('#login-submit');

  // Basic client-side validation
  if (!email || !pwd) {
    $('#login-alert-msg').text('Please fill in all fields.');
    $('#login-alert').fadeIn(200);
    return;
  }

  // Simulate loading
  $btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Signing in…').prop('disabled', true);
  $('#login-alert').hide();

  setTimeout(() => {
    // Demo: any valid email format + password ≥ 6 chars = success
    if (/\S+@\S+\.\S+/.test(email) && pwd.length >= 6) {
      // Save session flag
      localStorage.setItem('wb_logged_in', '1');
      localStorage.setItem('wb_user_email', email);
      window.location.href = 'dasboard.html';
    } else {
      $btn.html('<i class="fas fa-arrow-right-to-bracket"></i> Sign In').prop('disabled', false);
      $('#login-alert-msg').text('Invalid email or password. Try again.');
      $('#login-alert').fadeIn(200);
    }
  }, 1000);
});
</script>
</body>
</html>
