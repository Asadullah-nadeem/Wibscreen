upstream laravel_app {
    server app1:9000;
    server app2:9000;
    server app3:9000;
    server app4:9000;
    server app5:9000;
}

upstream terminal_backend {
    server terminal:7681;
}

server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Proxy terminal socket connection securely using ^~ to prevent regular expression match override
    location ^~ /terminal/ {
        auth_request /terminal-auth;
        auth_request_set $terminal_user $upstream_http_x_terminal_user;
        auth_request_set $terminal_pass $upstream_http_x_terminal_password;

        # Set query separator based on presence of existing arguments
        set $arg_separator "?";
        if ($is_args) {
            set $arg_separator "&";
        }

        # Extract nameserver and dns_option and convert to ttyd arg format
        set $extra_args "";
        if ($arg_nameserver != "") {
            set $extra_args "&arg=$arg_nameserver";
        }
        set $dns_arg "";
        if ($arg_dns_option != "") {
            set $dns_arg "&arg=$arg_dns_option";
        }

        proxy_pass http://terminal_backend$request_uri${arg_separator}arg=$terminal_user$extra_args$dns_arg;
        
        # WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Terminal-User $terminal_user;
        proxy_set_header X-Terminal-Password $terminal_pass;
        
        # Timeouts and Buffering
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Internal subrequest route to check token with FastCGI
    location = /terminal-auth {
        internal;
        fastcgi_pass laravel_app;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /terminal-auth-backend?$args;
        fastcgi_param QUERY_STRING $args;
    }

    # Serve WebAssembly VM files using ^~ to prevent regular expression match override
    location ^~ /linux/ {
        alias /var/www/Linux/;
        try_files $uri =404;
    }

    # Static Asset Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php?$query_string;
    }
}

