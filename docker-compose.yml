services:

  # PHP Application Service 1
  app1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-app1
    restart: unless-stopped
    tty: true
    ports:
      - "8001:9000"
    environment:
      SERVICE_NAME: app1
      SERVICE_TAGS: dev
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - wibscreen-network

  # PHP Application Service 2
  app2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-app2
    restart: unless-stopped
    tty: true
    ports:
      - "8002:9000"
    environment:
      SERVICE_NAME: app2
      SERVICE_TAGS: dev
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - wibscreen-network

  # PHP Application Service 3
  app3:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-app3
    restart: unless-stopped
    tty: true
    ports:
      - "8003:9000"
    environment:
      SERVICE_NAME: app3
      SERVICE_TAGS: dev
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - wibscreen-network

  # PHP Application Service 4
  app4:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-app4
    restart: unless-stopped
    tty: true
    ports:
      - "8004:9000"
    environment:
      SERVICE_NAME: app4
      SERVICE_TAGS: dev
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - wibscreen-network

  # PHP Application Service 5
  app5:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-app5
    restart: unless-stopped
    tty: true
    ports:
      - "8005:9000"
    environment:
      SERVICE_NAME: app5
      SERVICE_TAGS: dev
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - wibscreen-network

  # Nginx Web Server / Load Balancer Service
  web:
    image: nginx:alpine
    container_name: wibscreen-web
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wibscreen-network
    depends_on:
      - app1
      - app2
      - app3
      - app4
      - app5

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: wibscreen-db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    command: --innodb_flush_log_at_trx_commit=2 --innodb_doublewrite=0 --sync_binlog=0
    environment:
      MYSQL_DATABASE: Wibscreen
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_PASSWORD: "1234"
      MYSQL_USER: laravel_user
    volumes:
      - wibscreen-dbdata:/var/lib/mysql
    networks:
      - wibscreen-network

  # MySQL Auto-Backup Service (Daily and on Startup)
  db-backup:
    image: fradelg/mysql-cron-backup:latest
    container_name: wibscreen-db-backup
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backups:/backup
    environment:
      MYSQL_HOST: db
      MYSQL_USER: laravel_user
      MYSQL_PASS: "1234"
      MYSQL_DATABASE: Wibscreen
      CRON_TIME: "0 0 * * *"   # Run daily at midnight
      MAX_BACKUPS: 15          # Retain last 15 backups
      INIT_BACKUP: 1           # Perform initial backup on startup
      MYSQLDUMP_OPTS: "--no-tablespaces --column-statistics=0"
    networks:
      - wibscreen-network

  # phpMyAdmin Database Management Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wibscreen-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "1234"
      UPLOAD_LIMIT: 300M
    networks:
      - wibscreen-network
    depends_on:
      - db

  # Redis Master Node (Primary Database)
  redis-master:
    image: redis:alpine
    container_name: wibscreen-redis-master
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - wibscreen-network

  # Redis Replica Node (Replication from Master)
  redis-replica:
    image: redis:alpine
    container_name: wibscreen-redis-replica
    restart: unless-stopped
    command: redis-server --replicaof redis-master 6379 --save "" --appendonly no
    depends_on:
      - redis-master
    networks:
      - wibscreen-network

  # Redis Load Balancer / Proxy Service (HAProxy)
  redis:
    image: haproxy:alpine
    container_name: wibscreen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - redis-master
      - redis-replica
    networks:
      - wibscreen-network

  # Redis Commander - Web Administration GUI for Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: wibscreen-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - wibscreen-network
    depends_on:
      - redis

  # Node.js Service for Vite Asset Compilation & Hot-Reloading
  node:
    image: node:20-alpine
    container_name: wibscreen-node
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www
    environment:
      NODE_ENV: development
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run build && tail -f /dev/null"
    depends_on:
      - app1
    networks:
      - wibscreen-network

  # Laravel Queue Worker Service
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-queue
    restart: unless-stopped
    command: php artisan queue:listen
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
      - app1
    networks:
      - wibscreen-network

  # Laravel Scheduler Service
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: wibscreen-laravel-app
    container_name: wibscreen-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
      - app1
    networks:
      - wibscreen-network

  # Mailpit Service for local email testing
  mailpit:
    image: axllent/mailpit
    container_name: wibscreen-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - wibscreen-network

  # Fluentd Log Collector Service
  fluentd:
    image: fluent/fluentd:edge
    container_name: wibscreen-fluentd
    restart: unless-stopped
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./docker/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    networks:
      - wibscreen-network

  # RabbitMQ Message Broker & Queue Service
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wibscreen-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - wibscreen-network

  # Memcached Caching Service
  memcached:
    image: memcached:alpine
    container_name: wibscreen-memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    networks:
      - wibscreen-network

  # Varnish Cache Caching Accelerator Service
  varnish:
    image: varnish:alpine
    container_name: wibscreen-varnish
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - web
    networks:
      - wibscreen-network

  # HAProxy Web Load Balancer Service
  haproxy-web:
    image: haproxy:alpine
    container_name: wibscreen-haproxy-web
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./docker/haproxy-web.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web
    networks:
      - wibscreen-network

  # Traefik auto reverse proxy Service
  traefik:
    image: traefik:v3.0
    container_name: wibscreen-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8084:80"
      - "8085:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
    networks:
      - wibscreen-network

  # Web-Based Linux VM Terminal Console (Low Latency Shell)
  terminal:
    build:
      context: .
      dockerfile: docker/Dockerfile.terminal
    container_name: wibscreen-terminal
    restart: unless-stopped
    networks:
      - wibscreen-network



networks:
  wibscreen-network:
    driver: bridge

volumes:
  wibscreen-dbdata:
    driver: local
