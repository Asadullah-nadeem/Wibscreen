<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wibscreen | Browser Workspace</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container d-flex">
        <!-- Sidebar Panel -->
        <aside class="sidebar d-flex flex-column flex-shrink-0">
            <div class="sidebar-header p-4 d-flex align-items-center gap-3">
                <i class="fas fa-layer-group text-primary fs-4"></i>
                <span class="h5 mb-0 fw-bold">Wibscreen</span>
            </div>
            
            <div class="sidebar-content px-3 flex-grow-1 overflow-auto">
                <div class="search-container mb-4">
                    <i class="fas fa-search"></i>
                    <input type="text" id="global-search" class="form-control-plaintext" placeholder="Search tabs...">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 px-2">
                    <span class="text-uppercase small fw-bold text-muted letter-spacing-1">Collections</span>
                </div>
                <ul id="collections-list" class="nav nav-pills flex-column gap-1 mb-4">
                    <!-- Collections injected here -->
                </ul>
                
                <button id="add-collection-btn" class="btn btn-outline-secondary btn-sm w-100 border-dashed py-2">
                    <i class="fas fa-plus me-2"></i> New Folder
                </button>
            </div>

            <div class="sidebar-footer p-4 border-top">
                <div class="d-flex align-items-center gap-2 small text-muted">
                    <span class="status-dot online"></span>
                    <span>System Ready</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content flex-grow-1 d-flex flex-column">
            <!-- URL / Search Bar -->
            <header class="browser-header px-4 py-3 d-flex align-items-center gap-3">
                <div class="url-bar w-100 d-flex align-items-center px-3 py-2">
                    <i class="fas fa-shield-check text-primary me-2"></i>
                    <input type="text" id="main-url-input" class="form-control-plaintext small fw-medium" placeholder="Enter URL or search..." readonly>
                    <div class="ms-auto d-flex gap-3 text-muted align-items-center">
                        <i id="refresh-btn" class="fas fa-rotate-right cursor-pointer fs-6" title="Refresh"></i>
                        <i id="home-btn" class="fas fa-house-user cursor-pointer fs-6" title="Home"></i>
                    </div>
                </div>
            </header>

            <!-- Workspace Viewport -->
            <div class="workspace-viewport flex-grow-1 position-relative">
                <!-- Tab Manager Grid -->
                <div id="tab-manager" class="tab-dashboard h-100 p-4 p-xl-5 overflow-auto">
                    <div class="container-fluid">
                        <div class="d-flex justify-content-between align-items-end mb-5">
                            <div>
                                <h1 id="current-collection-name" class="h2 fw-bold mb-1 text-white">Workspace Dashboard</h1>
                                <p class="text-muted small mb-0">Select a card to resume your session</p>
                            </div>
                        </div>
                        
                        <div id="tabs-grid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3">
                            <!-- Small cards injected here -->
                        </div>
                    </div>
                </div>

                <!-- Live Iframe Area -->
                <div id="iframes-container" class="h-100"></div>

                <!-- Placeholder -->
                <div id="browser-placeholder" class="position-absolute top-50 start-50 translate-middle text-center">
                    <i class="fas fa-compass display-1 text-primary opacity-25 mb-4"></i>
                    <h2 class="h4 fw-bold text-white">Explore your Workspace</h2>
                    <p class="text-muted">No active session. Select a collection or add a website to start.</p>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-navbar">
            <div class="me-auto d-flex align-items-center gap-3 text-muted small">
                <i class="fas fa-circle-check text-success"></i>
                <span id="status-text" class="fw-medium">Workspace Engine Active</span>
            </div>
            
            <button id="add-website-btn" class="btn btn-primary btn-fab shadow-lg" title="Add Website">
                <i class="fas fa-plus"></i>
            </button>
            <button id="tab-switcher-btn" class="btn btn-dark btn-fab shadow-lg position-relative" title="Switch Tabs">
                <i class="fas fa-grip"></i>
                <span id="tab-count-badge" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle">0</span>
            </button>
        </nav>

        <!-- Modal: Add Website -->
        <div class="modal fade" id="addWebsiteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg">
                    <div class="modal-header border-0 p-4 pb-0">
                        <h5 class="modal-title fw-bold">Add New Website</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-4">
                            <label class="form-label small fw-bold">DESTINATION URL</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-0 text-muted"><i class="fas fa-globe"></i></span>
                                <input type="text" id="new-url-input" class="form-control bg-dark border-0 p-3" placeholder="https://example.com">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">DISPLAY NAME</label>
                                <input type="text" id="new-name-input" class="form-control bg-dark border-0 p-3" placeholder="Optional">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-muted">COLLECTION</label>
                                <select id="new-collection-select" class="form-select bg-dark border-0 p-3">
                                    <!-- Options injected here -->
                                </select>
                            </div>
                        </div>
                        <p id="validation-message" class="text-danger small mt-3 mb-0"></p>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0 gap-3">
                        <button type="button" class="btn btn-link text-muted text-decoration-none px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="load-website-btn" class="btn btn-primary px-4 py-3 fw-bold flex-grow-1">Add to Workspace</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal: Create Folder -->
        <div class="modal fade" id="createFolderModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg p-2">
                    <div class="modal-header border-0 p-4 pb-0">
                        <h5 class="modal-title fw-bold">Create New Folder</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">FOLDER NAME</label>
                            <input type="text" id="new-folder-input" class="form-control bg-dark border-0 p-3" placeholder="Enter folder name...">
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0 gap-3">
                        <button type="button" class="btn btn-link text-muted text-decoration-none px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="confirm-create-folder" class="btn btn-primary px-4 py-3 fw-bold flex-grow-1">Create Folder</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Context Menu -->
        <div id="context-menu" class="dropdown-menu shadow-lg p-2">
            <a class="dropdown-item rounded d-flex align-items-center gap-2 py-2" id="ctx-rename" href="#">
                <i class="fas fa-pen-to-square text-muted small"></i> Rename
            </a>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item rounded d-flex align-items-center gap-2 py-2 text-danger" id="ctx-delete" href="#">
                <i class="fas fa-trash-can small"></i> Delete
            </a>
        </div>

        <div id="toast-container" class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
