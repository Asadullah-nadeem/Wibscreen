<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wibscreen | Browser Workspace</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body data-theme="night">
    <div class="app-container d-flex">
        <!-- Sidebar Panel -->
        <aside class="sidebar d-flex flex-column flex-shrink-0">
            <div class="sidebar-header p-4 d-flex align-items-center gap-3">
                <div class="badge-initials">WS</div>
                <span class="h5 mb-0 fw-bold heading-title">Wibscreen</span>
            </div>
            
            <div class="sidebar-content px-3 flex-grow-1 overflow-auto">
                <div class="search-container mb-4 px-2">
                    <div class="d-flex align-items-center bg-input rounded-3 px-3 py-2">
                        <i class="fas fa-search text-muted me-2 small"></i>
                        <input type="text" id="global-search" class="form-control-plaintext small text-white" placeholder="Search tabs...">
                    </div>
                </div>

                <div class="px-2 mb-2">
                    <span class="text-uppercase small fw-bold text-muted opacity-50" style="letter-spacing: 1px;">Collections</span>
                </div>
                <ul class="nav flex-column mb-auto" id="collections-list">
                    <!-- Nav items injected via JS -->
                </ul>

                <button class="btn btn-outline-secondary btn-sm w-100 mt-4 py-2 border-dashed rounded-3" id="add-collection-btn">
                    <i class="fas fa-plus me-2"></i> New Folder
                </button>
            </div>

            <div class="sidebar-footer p-3 border-top border-secondary border-opacity-10">
                <button id="theme-toggle-btn" class="btn btn-outline-secondary btn-sm w-100 text-start px-3 mb-2">
                    <i class="fas fa-moon me-2"></i> <span>Night Mode</span>
                </button>
                <button id="open-settings-btn" class="btn btn-outline-secondary btn-sm w-100 text-start px-3">
                    <i class="fas fa-cog me-2"></i> Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content flex-grow-1 d-flex flex-column">
            <!-- URL / Search Bar -->
            <header class="browser-header px-4 py-3 d-flex align-items-center gap-3 border-bottom">
                <div class="url-bar w-100 d-flex align-items-center px-3 py-2 bg-input rounded-pill">
                    <i class="fas fa-shield-halved text-primary me-2"></i>
                    <input type="text" id="main-url-input" class="form-control-plaintext small fw-bold text-white" placeholder="Workspace Ready" readonly>
                    <div class="ms-auto d-flex gap-3 text-muted align-items-center">
                        <i id="refresh-btn" class="fas fa-rotate-right cursor-pointer fs-6" title="Refresh"></i>
                        <i id="home-btn" class="fas fa-house-user cursor-pointer fs-6" title="Home"></i>
                    </div>
                </div>
            </header>

            <!-- Workspace Viewport -->
            <div class="workspace-viewport flex-grow-1 position-relative">
                <div id="tab-manager" class="h-100 overflow-auto">
                    <!-- Dashboard Header -->
                    <div class="workspace-header">
                        <div>
                            <h1 id="current-collection-name" class="display-5 fw-bold mb-1 heading-title">Explore Workspace</h1>
                            <p class="text-muted mb-0">Manage your collections and saved tabs</p>
                        </div>
                        <div class="d-flex gap-3 align-items-center">
                            <div class="btn-group shadow-sm bg-input rounded-3">
                                <button type="button" id="sort-newest" class="btn btn-link text-muted px-3" title="Newest">
                                    <i class="fas fa-clock"></i>
                                </button>
                                <button type="button" id="sort-alphabetical" class="btn btn-link text-muted px-3" title="A-Z">
                                    <i class="fas fa-sort-alpha-down"></i>
                                </button>
                            </div>
                            <button class="btn btn-primary rounded-circle shadow-lg" id="add-website-btn" style="width: 48px; height: 48px;">
                                <i class="fas fa-plus fs-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Content Grid -->
                    <div id="tabs-grid" class="fade-in">
                        <!-- Collection sections injected here -->
                    </div>
                </div>

                <!-- Live Iframe Area -->
                <div id="iframes-container" class="h-100"></div>

                <!-- Global Placeholder -->
                <div id="browser-placeholder" class="position-absolute top-50 start-50 translate-middle text-center fade-in">
                    <div class="empty-placeholder">
                        <i class="fas fa-compass display-1 text-primary opacity-25 mb-4"></i>
                        <h2 class="h3 fw-bold">Ready to Explore</h2>
                        <p class="text-muted">Select a collection or add a new tab to start browsing.</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Quick Nav -->
            <footer class="p-3 border-top d-flex justify-content-between align-items-center bg-card">
                <div class="d-flex align-items-center gap-3">
                    <span id="tab-count-badge" class="badge rounded-pill bg-primary">0</span>
                    <span class="small fw-bold opacity-50">Tabs Active</span>
                </div>
                <div id="desktop-indicator" class="px-3 py-1 bg-input rounded-pill small fw-bold">Desktop 1</div>
            </footer>
        </main>
    </div>

    <!-- Modals Section -->
    
    <!-- Modal: Add Website -->
    <div class="modal fade" id="addWebsiteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">Add New Tab</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2">Website URL</label>
                        <input type="text" id="new-url-input" class="form-control p-3" placeholder="https://example.com">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold text-muted mb-2">Display Name</label>
                        <input type="text" id="new-name-input" class="form-control p-3" placeholder="My Favorite Site">
                    </div>
                    <div>
                        <label class="small fw-bold text-muted mb-2">Collection</label>
                        <select id="new-collection-select" class="form-select bg-input border-0 text-white p-3 rounded-3 shadow-none">
                            <!-- Options injected -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" id="load-website-btn" class="btn btn-primary w-100 py-3 fw-bold rounded-3">Add to Workspace</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: New Folder -->
    <div class="modal fade" id="createFolderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">Create Collection</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <input type="text" id="new-folder-input" class="form-control p-3" placeholder="Work, Social, Personal...">
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" id="confirm-create-folder" class="btn btn-primary w-100 py-3 fw-bold rounded-3">Create Collection</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Rename Folder -->
    <div class="modal fade" id="renameFolderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">Rename Collection</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <input type="text" id="rename-folder-input" class="form-control p-3">
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" id="confirm-rename-folder" class="btn btn-primary w-100 py-3 fw-bold rounded-3">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Settings -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content shadow-lg border-0">
                <div class="modal-header border-0 p-4">
                    <h5 class="modal-title fw-bold">Workspace Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <h6 class="fw-bold mb-3 small opacity-50 text-uppercase">Typography</h6>
                            <div class="mb-3">
                                <label class="small mb-1">Font Size</label>
                                <select id="set-font-size" class="form-select bg-input border-0 text-white">
                                    <option value="12px">Small</option>
                                    <option value="14px" selected>Normal</option>
                                    <option value="16px">Large</option>
                                    <option value="18px">Extra Large</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="small mb-1">Font Weight</label>
                                <select id="set-font-weight" class="form-select bg-input border-0 text-white">
                                    <option value="400">Regular</option>
                                    <option value="500" selected>Medium</option>
                                    <option value="600">Semi Bold</option>
                                    <option value="700">Bold</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6 class="fw-bold mb-3 small opacity-50 text-uppercase">Theme Colors</h6>
                            <div class="mb-3">
                                <label class="small mb-1">Accent Color</label>
                                <input type="color" id="set-primary-color" class="form-control form-control-color w-100 border-0" value="#6366f1">
                            </div>
                            <div class="mb-3">
                                <label class="small mb-1">Text Color</label>
                                <input type="color" id="set-text-color" class="form-control form-control-color w-100 border-0" value="#f8fafc">
                            </div>
                        </div>
                        <div class="col-12">
                            <h6 class="fw-bold mb-3 small opacity-50 text-uppercase">Layout</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="small mb-1">Card Radius</label>
                                    <input type="range" id="set-card-radius" class="form-range" min="0" max="40" value="20">
                                </div>
                                <div class="col-md-6">
                                    <label class="small mb-1">Sidebar Width</label>
                                    <input type="range" id="set-sidebar-width" class="form-range" min="200" max="400" value="280">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" id="reset-settings-btn" class="btn btn-link text-muted small">Reset Defaults</button>
                    <button type="button" class="btn btn-primary px-4 py-2 fw-bold rounded-3" data-bs-dismiss="modal">Apply Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
